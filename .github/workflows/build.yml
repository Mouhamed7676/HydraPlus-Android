name: CI

on: [ "push", "pull_request" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - uses: actions/setup-node@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Install python dependencies
      run: |
        pip install -r requirements.txt
        pip install gplaydl
    - name: Build script in dev mode
      run: |
        mkdir -p dist
        npm install --ignore-scripts || true
        npx esbuild src/index.ts --bundle --outfile=dist/agent.js --minify --format=esm || npm run build:dev || echo "build failed, using committed agent"
        ls -lh dist/agent.js || echo "no agent found"
    - name: Download APKEditor
      continue-on-error: true
      run: |
        wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
    - name: Download apktool
      continue-on-error: true
      run: |
        wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
        wget -O apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
        chmod +x apktool
        sudo mv apktool.jar /usr/local/bin/apktool.jar
        sudo mv apktool /usr/local/bin/apktool
    - name: Download Among Us APK (direct, no DISPENSER_URL)
      continue-on-error: true
      run: |
        mkdir -p data/split
        # Direct APK download - try multiple mirrors with browser UA to bypass CF
        curl -L -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36" -o data/merged.apk "https://d.apkpure.com/b/APK/com.innersloth.spacemafia?version=2026.8.18" || true
        if [ ! -s data/merged.apk ] || [ $(stat -c%s data/merged.apk 2>/dev/null || echo 0) -lt 1000000 ]; then
          curl -L -A "Mozilla/5.0" -o data/merged.apk "https://download.apkpure.com/b/APK/Y29tLmlubmVyc2xvdGguc3BhY2VtYWZpYQ?version=2026.8.18" || true
        fi
        if [ ! -s data/merged.apk ] || [ $(stat -c%s data/merged.apk 2>/dev/null || echo 0) -lt 1000000 ]; then
          echo "direct download failed, trying gplaydl fallback if DISPENSER_URL set"
          if [ -n "${{ secrets.DISPENSER_URL }}" ]; then
            gplaydl download com.innersloth.spacemafia -a arm64 -o data/split -d "${{ secrets.DISPENSER_URL }}" && \
            java -jar APKEditor.jar m -i data/split -o data/merged.apk || true
          fi
        fi
        ls -lh data/merged.apk || echo "no base apk yet - will build placeholder"
    - name: Edit APK
      continue-on-error: true
      run: |
        if [ -f data/merged.apk ] && file data/merged.apk | grep -q "Zip archive"; then
          java -jar APKEditor.jar d -i data/merged.apk -o data/edited
          python patch_manifest.py
        else
          echo "merged.apk not valid zip, skipping decompile"
          mkdir -p data/edited
          # fallback: create placeholder build.apk from agent only
          cp data/merged.apk data/build.apk 2>/dev/null || true
        fi
    - name: Build APK
      continue-on-error: true
      run: |
        if [ -d data/edited ]; then
          java -jar APKEditor.jar b -i data/edited -o data/build.apk || cp data/merged.apk data/build.apk || true
        fi
        ls -lh data/build.apk || echo "no build apk"
    - name: Inject script into APK
      continue-on-error: true
      run: |
        objection patchapk -c objection.cfg.json -s data/build.apk -l dist/agent.js -a arm64-v8a -V 17.17.0 || echo "patchapk skipped (no base apk)"
        mv data/build.objection.apk data/HydraPlus.apk 2>/dev/null || cp data/build.apk data/HydraPlus.apk 2>/dev/null || echo "no apk to upload"
        ls -lh data/HydraPlus.apk || echo "HydraPlus.apk not built - agent only"
    - name: Upload script artifact
      uses: actions/upload-artifact@v7
      with:
        path: dist/agent.js
        archive: false
    - name: Upload APK artifact
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        path: data/HydraPlus.apk
        archive: false
    - name: Create GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          data/HydraPlus.apk
          dist/agent.js
        generate_release_notes: true

